name: Pathai
description: PathAI is a healthcare artificial-intelligence company transforming pathology through machine
  learning. Its AISight Image Management System (IMS) and the AISight Link open API deliver AI-assisted
  disease detection, biomarker quantification, fields-of-interest and AI Impressions, and laboratory workflow
  integration for pathologists, hospital and reference labs, and biopharma research partners. AISight
  Link is an enterprise interoperability surface that connects AISight with third-party AI algorithms
  and Laboratory Information Systems (LIS/LIMS) over REST and HL7; PathAI does not publish a public developer
  portal, OpenAPI definition, or SDKs. The company is ISO 27001 certified and operates a vulnerability
  disclosure program. Added to the API Evangelist network as a portfolio company of 8vc.
